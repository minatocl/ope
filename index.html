    const [y, m, d] = dateStr.split("-").map(Number);
    const cur = new Date(y, m - 1, d);
    for (let i = 0; i < 30; i++) {
        cur.setDate(cur.getDate() - 1);
        const ds = fmtDate(cur);
        if (!isClinicClosedDay(ds))
            return ds;
    }
    return dateStr;
}

// 患者枠内の予約: 同時刻 or 短時間施術以外は終日 / 枠外(管理画面の 9:00 など): 所要時間(短時間30分・他60分)が重なる枠だけ
const toMin = (hm) => { const [h, m] = String(hm).split(":").map(Number); return h * 60 + m; };
function bookingBlocksSlot(bkTime, bkTreatment, slot) {
    if (bkTime === slot)
        return true;
    const light = isLightTreatmentText(bkTreatment);
    if (SLOT_TIMES.includes(bkTime))
        return !light;
    const st = toMin(bkTime), sl = toMin(slot);
    return sl < st + (light ? 30 : 60) && st < sl + 30;
}

const pad = (n) => String(n).padStart(2, "0");
const fmtDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function localDate(dateStr, lang) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dow = new Date(y, m - 1, d).getDay();
    if (lang === "ja")
        return `${m}月${d}日(${WD.ja[dow]})`;
    if (lang === "zh")
        return `${m}月${d}日(周${WD.zh[dow]})`;
    if (lang === "th")
        return `${WD.th[dow]}. ${d} ${MONTH_SHORT.th[m - 1]}`;
    if (lang === "vi")
        return `${WD.vi[dow]}, ${d}/${m}`;
    const wd = WD[lang][dow];
    const mo = MONTH_SHORT[lang][m - 1];
    if (lang === "en")
        return `${wd}, ${mo} ${d}`;
    return `${wd}, ${d} ${mo}`;
}
function monthLabel(year, month, lang) {
    if (lang === "ja" || lang === "zh")
        return `${year}年${month + 1}月`;
    if (lang === "vi")
        return `Tháng ${month + 1}/${year}`;
    return `${MONTH_NAMES[lang][month]} ${year}`;
}
// 受付できる最終日 = 今日の2ヶ月後(サーバー側 create_booking / create_consultation の
// `p_date > today + interval '2 months'` = too_far 判定と同じ基準)
const BOOK_AHEAD_MONTHS = 2;
function lastBookableDate(now = new Date()) {
    const day = now.getDate();
    const d = new Date(now.getFullYear(), now.getMonth(), day);
    d.setMonth(d.getMonth() + BOOK_AHEAD_MONTHS);
    // 12/31 の2ヶ月後が 3/3 に溢れるのを防ぐ(Postgres と同じく月末に丸める)
    if (d.getDate() !== day)
        d.setDate(0);
    return d;
}
function getMonths() {
    // 予約可能な最初の日(明後日)から最終日(2ヶ月後)までをカバーする月をすべて返す
    // (月末でも常に2ヶ月分の予約枠が見えるようにする)
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 2);
    const end = lastBookableDate(now);
    const list = [];
    const cur = new Date(start.getFullYear(), start.getMonth(), 1);
    while (cur <= end) {
        list.push({ year: cur.getFullYear(), month: cur.getMonth() });
        cur.setMonth(cur.getMonth() + 1);
    }
    return list;
}
function gcalUrl({ date, time, title, details }) {
    const d = date.replace(/-/g, "");
    const [h, mi] = time.split(":");
    const start = `${d}T${h}${mi}00`;
    const endH = mi === "30" ? pad(Number(h) + 1) : h;
    const endM = mi === "30" ? "00" : "30";
    const end = `${d}T${endH}${endM}00`;
    const p = new URLSearchParams({
        action: "TEMPLATE", text: title, dates: `${start}/${end}`,
        ctz: "Asia/Tokyo", details,
    });
    return `https://calendar.google.com/calendar/render?${p.toString()}`;
}

// ================= 日本の祝日(暦通りの休みは受付しない) =================
// 2000〜2099年の近似式(春分/秋分)+ハッピーマンデー+振替休日+国民の休日
const _jpHolidayCache = {};
function jpHolidaySet(year) {
    if (_jpHolidayCache[year]) return _jpHolidayCache[year];
    const q = year - 2000;
    const lp = Math.floor(q / 4);
    const nthMon = (m, n) => 1 + ((8 - new Date(year, m - 1, 1).getDay()) % 7) + 7 * (n - 1);
    const base = [
        [1, 1], [2, 11], [2, 23], [4, 29], [5, 3], [5, 4], [5, 5], [8, 11], [11, 3], [11, 23],
        [1, nthMon(1, 2)], [7, nthMon(7, 3)], [9, nthMon(9, 3)], [10, nthMon(10, 2)],
        [3, Math.floor(20.69115 + 0.2421904 * q - lp)],
        [9, Math.floor(23.09 + 0.2421904 * q - lp)],
    ];
    const key = (dt) => (dt.getMonth() + 1) * 100 + dt.getDate();
    const set = new Set(base.map(([m, d]) => m * 100 + d));
    // 振替休日: 日曜に当たる祝日 → 直後の祝日でない日
    base.forEach(([m, d]) => {
        if (new Date(year, m - 1, d).getDay() !== 0) return;
        const nx = new Date(year, m - 1, d + 1);
        while (set.has(key(nx))) nx.setDate(nx.getDate() + 1);
        set.add(key(nx));
    });
    // 国民の休日: 祝日に挟まれた平日(9月の連休など)
    for (const t = new Date(year, 0, 2); t.getFullYear() === year; t.setDate(t.getDate() + 1)) {
        if (t.getDay() === 0 || set.has(key(t))) continue;
        const pv = new Date(year, t.getMonth(), t.getDate() - 1);
        const nx = new Date(year, t.getMonth(), t.getDate() + 1);
        if (set.has(key(pv)) && set.has(key(nx))) set.add(key(t));
    }
    _jpHolidayCache[year] = set;
    return set;
}
function isJpHoliday(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return jpHolidaySet(y).has(m * 100 + d);
}
