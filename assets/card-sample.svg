<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 470" width="300" height="470" font-family="'Hiragino Kaku Gothic ProN','Zen Kaku Gothic New',sans-serif">
  <!-- 診察券の見本(ダミー情報)。実物の向き: 上から ID/カナ/氏名/生年月日/診療時間/バーコード、最下部にクリニック名。赤い枠=診察券番号 -->
  <rect x="2" y="2" width="296" height="466" rx="18" fill="#141414" stroke="#3a3a3a" stroke-width="2"/>
  <path d="M274 30 l-22 0 l22 22 z" fill="#ffffff"/>
  <rect x="34" y="60" width="232" height="318" rx="4" fill="#ffffff"/>
  <!-- ID(ここが診察券番号) -->
  <rect x="44" y="76" width="150" height="40" rx="8" fill="none" stroke="#D63B2F" stroke-width="4"/>
  <text x="56" y="104" font-size="22" font-weight="700" fill="#222" letter-spacing="1">ID 12345</text>
  <path d="M206 96 l34 0 m-10 -9 l10 9 l-10 9" fill="none" stroke="#D63B2F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 223 96)"/>
  <text x="56" y="150" font-size="13" fill="#222">ミナト ハナコ</text>
  <text x="56" y="188" font-size="26" font-weight="700" fill="#222">湊 花子 <tspan font-size="15" font-weight="400">様</tspan></text>
  <text x="56" y="216" font-size="13" fill="#222">H5/1/1生 女性</text>
  <text x="150" y="272" text-anchor="middle" font-size="13" fill="#222">月〜土 9:00〜19:00</text>
  <text x="150" y="290" text-anchor="middle" font-size="13" fill="#222">最終受付18:45</text>
  <!-- バーコード風 -->
  <g fill="#222">
    <rect x="86" y="312" width="3" height="40"/><rect x="92" y="312" width="2" height="40"/><rect x="97" y="312" width="4" height="40"/>
    <rect x="104" y="312" width="2" height="40"/><rect x="109" y="312" width="3" height="40"/><rect x="115" y="312" width="2" height="40"/>
    <rect x="120" y="312" width="5" height="40"/><rect x="128" y="312" width="2" height="40"/><rect x="133" y="312" width="3" height="40"/>
    <rect x="139" y="312" width="2" height="40"/><rect x="144" y="312" width="4" height="40"/><rect x="151" y="312" width="2" height="40"/>
    <rect x="156" y="312" width="3" height="40"/><rect x="162" y="312" width="5" height="40"/><rect x="170" y="312" width="2" height="40"/>
    <rect x="175" y="312" width="3" height="40"/><rect x="181" y="312" width="2" height="40"/><rect x="186" y="312" width="4" height="40"/>
    <rect x="193" y="312" width="2" height="40"/><rect x="198" y="312" width="3" height="40"/><rect x="204" y="312" width="2" height="40"/><rect x="209" y="312" width="4" height="40"/>
  </g>
  <text x="150" y="430" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="2">みなとクリニック</text>
</svg>
